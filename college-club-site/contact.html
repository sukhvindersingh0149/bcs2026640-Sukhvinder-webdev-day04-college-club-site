<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact details and message form." />
    <title>Contact us</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="index.html">Campus Connect</a>
      <nav aria-label="Main">
        <a href="index.html">Home</a><a href="about.html">About</a
        ><a href="registration.html">Registration</a
        ><a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </header>
    <main>
      <section>
        <h1>Contact us</h1>
        <div class="grid">
          <article>
            <h2>Email</h2>
            <p>
              <a href="mailto:hello@campusconnect.example"
                >hello@campusconnect.example</a
              >
            </p>
          </article>
          <article>
            <h2>Meeting room</h2>
            <p>Lab 2, Block C, every Friday at 4 pm.</p>
          </article>
        </div>
      </section>
      <section>
        <form action="#" method="post">
          <fieldset>
            <legend>Send a message</legend>
            <label for="n">Your name</label
            ><input id="n" name="n" type="text" required />
            <label for="e">Your email</label
            ><input id="e" name="e" type="email" required />
            <label for="m">Message</label
            ><textarea id="m" name="m" rows="5" required></textarea>
            <button class="btn" type="submit">Send message</button>
          </fieldset>
        </form>
      </section>
    </main>
    <footer><p>&copy; 2026 Campus Connect College Club</p></footer>
  </body>
</html>
